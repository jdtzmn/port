<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-labelledby="title desc">
  <title id="title">Port gives every worktree its own address on the same port</title>
  <desc id="desc">Port in the center connects two Git worktrees. The feature-1 worktree runs at feature-1.port:3000 and the feature-2 worktree runs at feature-2.port:3000, so the same service port works in both with no conflicts.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; text-anchor: middle; }
    .hero { font-size: 56px; font-weight: 700; fill: #ffffff; }
    .branch { font-size: 22px; font-weight: 700; fill: #166534; }
    .url { font-size: 22px; font-weight: 700; }
    .tagline { font-size: 22px; fill: #334155; }
    .card { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .link { stroke: #64748b; stroke-width: 3; fill: none; }
  </style>

  <rect width="880" height="270" rx="14" fill="#f8fafc" stroke="#e2e8f0" />

  <!-- Links -->
  <path class="link" d="M340 120 L300 120" />
  <path class="link" d="M540 120 L580 120" />

  <!-- Port -->
  <rect x="340" y="60" width="200" height="120" rx="18" fill="#0f172a" />
  <text class="hero" x="440" y="137">Port</text>

  <!-- Worktrees -->
  <rect class="card" x="20" y="60" width="280" height="120" rx="14" />
  <text class="branch" x="160" y="100">feature-1</text>
  <text class="url" x="160" y="142">feature-1.port:3000</text>

  <rect class="card" x="580" y="60" width="280" height="120" rx="14" />
  <text class="branch" x="720" y="100">feature-2</text>
  <text class="url" x="720" y="142">feature-2.port:3000</text>

  <text class="tagline" x="440" y="226">Same service, same port, no conflicts.</text>
</svg>
