<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Port routes one local domain per Git worktree</title>
  <desc id="desc">A browser requests feature-1.port:3000 and feature-2.port:3000. Traefik routes each request by hostname to the web service in the matching worktree, so both worktrees use the same service port without conflict.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569" />
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
    .label { font-size: 14px; }
    .title { font-size: 15px; font-weight: 700; }
    .muted { font-size: 12px; fill: #475569; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .hub { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
    .wt { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .link { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  </style>

  <rect width="880" height="330" rx="14" fill="#f8fafc" stroke="#e2e8f0" />

  <!-- Browser -->
  <rect class="box" x="30" y="95" width="210" height="140" rx="10" />
  <text class="title" x="135" y="125" text-anchor="middle">Browser / client</text>
  <text class="label" x="135" y="164" text-anchor="middle">feature-1.port:3000</text>
  <text class="label" x="135" y="198" text-anchor="middle">feature-2.port:3000</text>

  <!-- Traefik -->
  <rect class="hub" x="340" y="95" width="200" height="140" rx="10" />
  <text class="title" x="440" y="135" text-anchor="middle">Traefik</text>
  <text class="muted" x="440" y="162" text-anchor="middle">one global proxy</text>
  <text class="muted" x="440" y="182" text-anchor="middle">routes by Host header</text>
  <text class="muted" x="440" y="202" text-anchor="middle">*.port → 127.0.0.1</text>

  <!-- Worktrees -->
  <rect class="wt" x="640" y="40" width="210" height="100" rx="10" />
  <text class="title" x="745" y="68" text-anchor="middle">feature-1 worktree</text>
  <text class="label" x="745" y="96" text-anchor="middle">web (container :3000)</text>
  <text class="muted" x="745" y="120" text-anchor="middle">no host port bound</text>

  <rect class="wt" x="640" y="190" width="210" height="100" rx="10" />
  <text class="title" x="745" y="218" text-anchor="middle">feature-2 worktree</text>
  <text class="label" x="745" y="246" text-anchor="middle">web (container :3000)</text>
  <text class="muted" x="745" y="270" text-anchor="middle">no host port bound</text>

  <!-- Links -->
  <path class="link" d="M240 165 L340 165" />
  <path class="link" d="M540 150 C590 150 590 90 640 90" />
  <path class="link" d="M540 180 C590 180 590 240 640 240" />

  <text class="muted" x="440" y="312" text-anchor="middle">Same service port in every worktree, no conflicts.</text>
</svg>
