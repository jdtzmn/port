name: CI

on: push

jobs:
  core-checks:
    name: Core Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Port
        uses: ./.github/actions/setup-port
        with:
          configure-git-identity: 'true'

      - name: Check formatting
        run: bun run format:check

      - name: Run linter
        run: bun run lint
      - name: Check ONBOARD.md is up to date
        run: |
          bun -e "import { generateMarkdown } from './src/commands/onboard.ts'; require('fs').writeFileSync('ONBOARD.md', generateMarkdown());"
          git diff --exit-code ONBOARD.md || (echo "ONBOARD.md is out of sync — run 'port onboard --md' to regenerate" && exit 1)

      - name: Check Port skill is up to date
        run: |
          bun run generate:skill
          git diff --exit-code skills/port-cli/SKILL.md || (echo "skills/port-cli/SKILL.md is out of sync — run 'bun run generate:skill' to regenerate" && exit 1)

  linux-integration:
    name: Linux Integration Tests
    needs: core-checks
    uses: ./.github/workflows/linux-integration-tests.yml
    with:
      run-traefik-diagnostics: true
      shards: '[1,2,3,4]'
      total-shards: 4
