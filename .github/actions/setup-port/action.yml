name: Setup Port
description: Install a pinned Bun runtime, restore dependency downloads, install dependencies, and build Port.

inputs:
  configure-git-identity:
    description: Configure the Git identity required by repository fixture tests.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Configure git identity
      if: inputs.configure-git-identity == 'true'
      shell: bash
      run: |
        git config --global user.email "ci@test.local"
        git config --global user.name "CI Runner"

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Restore Bun download cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Build
      shell: bash
      run: bun run build
